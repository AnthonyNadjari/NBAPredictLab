name: Publish Twitter Thread

on:
  repository_dispatch:
    types: [publish_thread]

# One publish at a time: avoids push races and double posting
concurrency:
  group: publish-thread
  cancel-in-progress: false

jobs:
  publish:
    # RUNNER repo variable: 'self-hosted' (home PC, free) or unset (GitHub-hosted, needs Actions billing)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      # Never interpolate client_payload directly into `run:` (shell injection)
      GAME_ID: ${{ github.event.client_payload.game_id }}

    steps:
      - name: Validate game id
        run: |
          if ! printf '%s' "$GAME_ID" | grep -Eq '^[A-Za-z0-9_.-]{1,120}$'; then
            echo "Invalid game id"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ${{ vars.RUNNER != 'self-hosted' && 'pip' || '' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # kaleido v1 renders charts with Chrome
          plotly_get_chrome -y || echo "::warning::could not install Chrome for kaleido"

      - name: Generate images and post thread
        env:
          TW_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TW_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TW_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TW_DRY_RUN: "false"
        run: python scripts/publish_single_thread.py "$GAME_ID"

      - name: Mark as published in JSON
        run: python scripts/mark_published.py "$GAME_ID"

      - name: Commit updated JSON
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # Re-apply the flag on top of the latest remote state each try, so a
          # concurrent daily export is never overwritten.
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/mark_published.py "$GAME_ID"
            git add docs/pending_games.json
            git diff --staged --quiet && exit 0
            git commit -m "Mark game $GAME_ID as published"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::push failed"; exit 1
