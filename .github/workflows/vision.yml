# NBAVision reply bot on GitHub-hosted runners (free: public repo).
# Ticks every 15 min; vision/tools/schedule_gate.py decides from docs/vision/schedule.json
# (Paris time, editable in the control panel) whether a session is due.
#
# The X session survives between runs as an AES-256 encrypted file in the Actions
# cache (key: secret X_STATE_KEY). The cache is readable by other workflows of this
# public repo, the plaintext is not. First login: TWITTER_COOKIES_JSON secret
# (set from the control panel, tab "Compte X").

name: NBAVision Reply Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (scrape + LLM, no posting)"
        type: boolean
        default: false
      max_replies:
        description: "Max replies this session (blank = schedule setting)"
        required: false
        default: ""
      login_check:
        description: "Only check the X login (no LLM, nothing posted)"
        type: boolean
        default: false

concurrency:
  group: nbavision
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      NBAVISION_BROWSER_CHANNEL: chrome   # Google Chrome is preinstalled on ubuntu runners

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Is a session due?
        id: gate
        run: |
          echo "NBAVISION_STATE_DIR=$RUNNER_TEMP/nbavision" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "slot=" >> "$GITHUB_OUTPUT"; echo "manual run"
          else
            python3 -m pip install -q python-dotenv tzdata >/dev/null
            python3 vision/tools/schedule_gate.py
          fi

      - name: Set up Python 3.11
        if: steps.gate.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vision/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.due == 'true'
        run: |
          python -m pip install -q -r vision/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore X session (encrypted)
        if: steps.gate.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: x_state.enc
          key: x-session-${{ github.run_id }}
          restore-keys: x-session-

      - name: Decrypt X session
        if: steps.gate.outputs.due == 'true'
        env:
          X_STATE_KEY: ${{ secrets.X_STATE_KEY }}
        run: |
          mkdir -p "$NBAVISION_STATE_DIR"
          if [ -f x_state.enc ] && [ -n "$X_STATE_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:X_STATE_KEY \
              -in x_state.enc -out "$NBAVISION_STATE_DIR/state.json" && echo "previous session restored" \
              || echo "::warning::could not decrypt the saved session"
          else
            echo "no saved session yet"
          fi

      - name: Run reply session
        if: steps.gate.outputs.due == 'true'
        working-directory: vision
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_PROFILE_USERNAME: ${{ vars.BOT_PROFILE_USERNAME || 'NBAPredictLab' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_REPLIES: ${{ github.event.inputs.max_replies }}
          NBAVISION_RUN_ID: ${{ github.run_id }}
          NBAVISION_SLOT: ${{ steps.gate.outputs.slot }}
          NBAVISION_LOGIN_CHECK: ${{ github.event.inputs.login_check || 'false' }}
        run: |
          python main.py 2>&1 | tee logs/run_output.log
          exit ${PIPESTATUS[0]}

      - name: Encrypt X session
        if: always() && steps.gate.outputs.due == 'true'
        env:
          X_STATE_KEY: ${{ secrets.X_STATE_KEY }}
        run: |
          rm -f x_state.enc
          if [ -s "$NBAVISION_STATE_DIR/state.json" ] && [ -n "$X_STATE_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:X_STATE_KEY \
              -in "$NBAVISION_STATE_DIR/state.json" -out x_state.enc
            rm -f "$NBAVISION_STATE_DIR/state.json"
          fi

      - name: Save X session (encrypted)
        if: always() && steps.gate.outputs.due == 'true' && hashFiles('x_state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: x_state.enc
          key: x-session-${{ github.run_id }}

      - name: Upload session logs
        if: always() && steps.gate.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vision-logs-${{ github.run_id }}
          path: |
            vision/logs/*.json
            vision/logs/*.png
            vision/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Push stats and run summary
        if: always() && steps.gate.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/vision && cp docs/vision/stats.json docs/vision/runs.json /tmp/vision/ 2>/dev/null || true
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python vision/tools/merge_status.py /tmp/vision
            git add docs/vision/stats.json docs/vision/runs.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Vision: session ${{ github.run_id }}"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push vision status"; exit 1
