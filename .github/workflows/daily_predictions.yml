name: Daily NBA Predictions

on:
  schedule:
    # 09:00 UTC = 11:00 Paris (CEST) / 10:00 Paris (CET)
    - cron: '0 9 * * *'
    # Evening refresh, 21:00 UTC = 5 pm ET: odds and injury report updated before tip-off
    # (keep this line second: the control panel edits the first cron only)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ${{ vars.RUNNER != 'self-hosted' && 'pip' || '' }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily prediction pipeline
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          # read-only X call: account check + daily follower count
          TW_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TW_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TW_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TW_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            python scripts/morning_routine.py --refresh
          else
            python scripts/morning_routine.py
          fi
