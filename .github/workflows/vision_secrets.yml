# Relay the reply bot's secrets to the IONOS server, encrypted for it alone.
#
# GitHub secrets can't be read back, and the bot runs on the server. This job seals
# LLM_API_KEY / TWITTER_COOKIES_JSON / BROWSER_PROXY with the server's RSA public key
# (vision/server/relay_pub.pem; the private key never leaves the server) and commits
# the ciphertext; the server's tick decrypts it. Triggered by the control panel each
# time a secret is saved, or by hand.

name: Relay reply bot secrets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vision-secrets
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Seal secrets for the server
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
        run: |
          umask 077
          python3 - > "$RUNNER_TEMP/secrets.env" <<'PY'
          import os, shlex
          for k in ("LLM_API_KEY", "TWITTER_COOKIES_JSON", "BROWSER_PROXY"):
              v = os.environ.get(k, "")
              if v:
                  print(f"{k}={shlex.quote(v)}")
          PY
          PASS=$(openssl rand -base64 48 | tr -d '\n')
          printf '%s' "$PASS" | openssl pkeyutl -encrypt -pubin -inkey vision/server/relay_pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out vision/server/secrets.key.enc
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "pass:$PASS" \
            -in "$RUNNER_TEMP/secrets.env" -out vision/server/secrets.enc
          rm -f "$RUNNER_TEMP/secrets.env"

      - name: Commit the ciphertext
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp vision/server/secrets.enc vision/server/secrets.key.enc "$RUNNER_TEMP/"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/secrets.enc" "$RUNNER_TEMP/secrets.key.enc" vision/server/
            git add vision/server/secrets.enc vision/server/secrets.key.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "Relay reply bot secrets (sealed for the server)"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
