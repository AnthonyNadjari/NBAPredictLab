name: Tests

on:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', 'daily_auto_prediction.py', 'requirements.txt']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install "pandas>=2.1.0,<2.2.0" "numpy>=1.26.0,<2" scikit-learn==1.6.1 requests pytest python-dotenv tweepy
      - run: python -m pytest tests -q
