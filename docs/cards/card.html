<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>PredictLab card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<!--
  One template for every image the bot posts (and for the control panel preview).
  Data comes from the URL hash (#base64url JSON) or window.__CARD__.
  Types: match | edge | announce | recap. Size: 1200x675 (X's 16:9).
  Type rules: Big Shoulders = names and numbers, Plex Sans = labels and prose,
  Plex Mono = dates/times only. One radius (--r). Orange = the brand, used sparingly.
-->
<style>
  :root {
    --bg: #0E1726; --panel: #162235; --ink: #F2F5F9; --muted: #8C9BB0; --dim: #5E6D84; --line: #26344B;
    --ball: #F07431; --win: #3DBA84; --loss: #EE6A5F; --r: 10px;
    --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --sans: 'IBM Plex Sans', Arial, sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 675px; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  #card { position: relative; width: 1200px; height: 675px; padding: 38px 56px 28px 60px; overflow: hidden; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; font: 500 19px var(--mono); color: var(--muted); letter-spacing: .3px; text-transform: uppercase; }
  .brand { font: 800 28px/1 var(--display); letter-spacing: 1px; color: var(--ink); text-transform: uppercase; }
  .brand b { color: var(--ball); font-weight: 800; }
  .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
  .stripe i { display: block; height: 50%; }
  .lab { font: 600 17px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }

  /* match */
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 26px; }
  .team { display: flex; align-items: center; gap: 20px; }
  .team.home { flex-direction: row-reverse; text-align: right; }
  .team img { width: 124px; height: 124px; object-fit: contain; }
  .tname { font: 900 68px/0.9 var(--display); text-transform: uppercase; letter-spacing: .5px; }
  .tsub { font: 500 19px var(--sans); color: var(--muted); margin-top: 6px; }
  .vs { font: 800 30px var(--display); color: var(--dim); padding: 0 24px; }
  .bar { display: flex; height: 84px; border-radius: var(--r); overflow: hidden; margin-top: 28px; gap: 4px; }
  .bar > div { display: flex; align-items: center; min-width: 90px; }
  .bar .a { padding-left: 20px; } .bar .h { justify-content: flex-end; padding-right: 20px; }
  .bar span { font: 900 62px/1 var(--display); color: #fff; }
  .bar .lose { opacity: .55; }
  .bar .lose span { font-size: 44px; }
  .pick { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; margin-top: auto; }
  .who { font: 900 92px/0.86 var(--display); text-transform: uppercase; letter-spacing: .5px; margin-top: 10px; white-space: nowrap; }
  .who em { font-style: normal; color: var(--ball); margin-left: 14px; }
  .src { display: flex; gap: 0; align-items: stretch; }
  .src > div { padding: 0 0 0 26px; margin-left: 26px; border-left: 2px solid var(--line); }
  .src > div:first-child { border-left: 0; margin-left: 0; padding-left: 0; }
  .src .v { font: 900 54px/0.9 var(--display); margin-top: 8px; }
  .src .v.ours { color: var(--ink); }
  .src .v.ext { color: var(--muted); }
  .srctext { font: 500 21px/1.4 var(--sans); color: var(--muted); text-align: right; max-width: 420px; }
  .srctext b { color: var(--ink); font-weight: 600; }
  .tape { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tape > div { padding: 12px 20px 12px; border-left: 1px solid var(--line); }
  .tape > div:first-child { border-left: 0; padding-left: 0; }
  .tape .lab { font-size: 15px; }
  .tape .v { font: 800 38px/1 var(--display); margin-top: 6px; display: flex; justify-content: space-between; }
  .tape .v span:first-child { color: color-mix(in srgb, var(--ac) 50%, #fff); } .tape .v span:last-child { color: color-mix(in srgb, var(--hc) 50%, #fff); }

  /* edge */
  .eyebrow { font: 600 20px var(--sans); color: var(--ball); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 28px; }
  .eyebrow span { color: var(--muted); }
  .title { font: 900 112px/0.88 var(--display); text-transform: uppercase; margin-top: 8px; letter-spacing: .5px; }
  .sub { font: 500 33px/1.3 var(--sans); color: var(--ink); opacity: .88; margin-top: 16px; max-width: 1060px; }
  .duel { margin-top: auto; display: flex; flex-direction: column; gap: 18px; }
  .drow .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .gap { font: 900 78px/0.88 var(--display); color: var(--ball); text-transform: uppercase; letter-spacing: .5px; }
  .dpair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dv { border-radius: var(--r); padding: 20px 26px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; }
  .dv .t { font: 800 32px var(--display); letter-spacing: .5px; }
  .dv .n { font: 900 96px/1 var(--display); }
  .dv.lose { background: transparent !important; border-color: var(--line); color: var(--muted); }

  /* brand footer: the orange that ties every card to PredictLab, kept quiet */
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 14px;
          border-top: 1px solid var(--line); position: relative; font: 500 17px var(--sans); color: var(--dim); }
  .foot::before { content: ''; position: absolute; left: 0; top: -2px; width: 72px; height: 3px; background: var(--ball); }
  .foot b { color: var(--muted); font-weight: 600; }

  /* announce */
  .rk-title { font: 900 72px/0.9 var(--display); text-transform: uppercase; margin-top: 10px; }
  .rk-title em { font-style: normal; color: var(--ball); }
  .rk { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; margin-top: auto; }
  .rk .r { display: grid; grid-template-columns: 34px 46px 1fr auto; align-items: center; gap: 12px;
           padding: 9px 0; border-top: 1px solid var(--line); }
  .rk .n { font: 800 22px var(--display); color: var(--dim); font-variant-numeric: tabular-nums; }
  .rk .r.podium .n { color: var(--ball); }
  .rk.few .r { padding: 16px 0; } .rk.few .t { font-size: 34px; } .rk.few .v { font-size: 40px; }
  .rk img { width: 42px; height: 42px; object-fit: contain; }
  .rk .t { font: 800 30px var(--display); text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rk .t small { display: block; font: 500 15px var(--sans); color: var(--dim); text-transform: none; letter-spacing: 0; }
  .rk .v { font: 800 34px var(--display); font-variant-numeric: tabular-nums; }
  .big2 { font: 900 150px/0.84 var(--display); text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; }
  .big2 em { font-style: normal; color: var(--ball); }
  .games { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: auto; border-top: 1px solid var(--line); padding-top: 18px; }
  .gm { display: flex; align-items: center; justify-content: center; gap: 22px; border-left: 1px solid var(--line); }
  .gm:first-child { border-left: 0; }
  .gm img { width: 60px; height: 60px; object-fit: contain; }
  .gm span { font: 800 22px var(--display); color: var(--dim); }

  /* recap */
  .rec { display: flex; align-items: flex-end; gap: 48px; margin: auto 0; }
  .big { font: 900 280px/0.8 var(--display); letter-spacing: 2px; }
  .big i { font-style: normal; color: var(--line); padding: 0 8px; }
  .rate { padding-bottom: 8px; }
  .rate .v { font: 900 120px/0.85 var(--display); color: var(--ball); }
  .rate .x { font: 500 21px var(--sans); color: var(--muted); margin-top: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 2fr; margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; }
  .stat + .stat { border-left: 1px solid var(--line); padding-left: 28px; }
  .stat .v { font: 800 50px/1 var(--display); margin-top: 8px; }
</style>
</head>
<body>
<div id="card"></div>
<script>
const TEAMS = {
  ATL: ['Hawks', '#E03A3E', 'atl', 'Atlanta'], BOS: ['Celtics', '#007A33', 'bos', 'Boston'],
  BKN: ['Nets', '#3B3B3B', 'bkn', 'Brooklyn'], CHA: ['Hornets', '#1D1160', 'cha', 'Charlotte'],
  CHI: ['Bulls', '#CE1141', 'chi', 'Chicago'], CLE: ['Cavaliers', '#860038', 'cle', 'Cleveland'],
  DAL: ['Mavericks', '#00538C', 'dal', 'Dallas'], DEN: ['Nuggets', '#0E2240', 'den', 'Denver'],
  DET: ['Pistons', '#C8102E', 'det', 'Detroit'], GSW: ['Warriors', '#1D428A', 'gs', 'Golden State'],
  HOU: ['Rockets', '#CE1141', 'hou', 'Houston'], IND: ['Pacers', '#002D62', 'ind', 'Indiana'],
  LAC: ['Clippers', '#C8102E', 'lac', 'LA'], LAL: ['Lakers', '#552583', 'lal', 'Los Angeles'],
  MEM: ['Grizzlies', '#5D76A9', 'mem', 'Memphis'], MIA: ['Heat', '#98002E', 'mia', 'Miami'],
  MIL: ['Bucks', '#00471B', 'mil', 'Milwaukee'], MIN: ['Timberwolves', '#236192', 'min', 'Minnesota'],
  NOP: ['Pelicans', '#0C2340', 'no', 'New Orleans'], NYK: ['Knicks', '#F58426', 'ny', 'New York'],
  OKC: ['Thunder', '#007AC1', 'okc', 'Oklahoma City'], ORL: ['Magic', '#0077C0', 'orl', 'Orlando'],
  PHI: ['76ers', '#006BB6', 'phi', 'Philadelphia'], PHX: ['Suns', '#1D1160', 'phx', 'Phoenix'],
  POR: ['Trail Blazers', '#E03A3E', 'por', 'Portland'], SAC: ['Kings', '#5A2D81', 'sac', 'Sacramento'],
  SAS: ['Spurs', '#6E7378', 'sa', 'San Antonio'], TOR: ['Raptors', '#CE1141', 'tor', 'Toronto'],
  UTA: ['Jazz', '#002B5C', 'utah', 'Utah'], WAS: ['Wizards', '#002B5C', 'wsh', 'Washington'],
};
const ALT = { ATL: '#C1D32F', CHI: '#4B4B4B', HOU: '#4B4B4B', TOR: '#4B4B4B', DET: '#1D42BA', LAC: '#1D428A',
  POR: '#4B4B4B', MIN: '#78BE20', NOP: '#B4975A', UTA: '#F9A01B', WAS: '#E31837', CHA: '#00788C', PHX: '#E56020',
  DEN: '#FEC524', IND: '#FDBB30', BKN: '#707271', SAS: '#C4CED4', MIA: '#F9A01B', CLE: '#FDBB30', DAL: '#B8C4CA',
  MEM: '#12173F', OKC: '#EF3B24', ORL: '#C4CED4', GSW: '#FFC72C', BOS: '#BA9653', LAL: '#FDB927', MIL: '#EEE1C6',
  NYK: '#006BB6', PHI: '#ED174C', SAC: '#63727A' };

function dist(a, b) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}
function colors(away, home) {
  let ca = (TEAMS[away] || [, '#888'])[1], ch = (TEAMS[home] || [, '#555'])[1];
  if (dist(ca, ch) < 110) ca = ALT[away] || '#7A8699';
  // keep both readable on the navy background
  if (dist(ch, '#0E1726') < 60) ch = ALT[home] || ch;
  if (dist(ca, '#0E1726') < 60) ca = ALT[away] || ca;
  return [ca, ch];
}
const logo = c => `https://a.espncdn.com/i/teamlogos/nba/500/${(TEAMS[c] || [, , c.toLowerCase()])[2]}.png`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const brand = d => `<div class="brand">Predict<b>Lab</b></div>`;
const foot = (right) => `<div class="foot"><span><b>@NBAPredictLab</b> · NBA probabilities</span><span>${esc(right || 'Probabilities, not locks')}</span></div>`;
const tname = c => (TEAMS[c] || [c])[0];

function announce(d) {
  const games = (d.games || []).slice(0, 3).map(g => `<div class="gm"><img src="${logo(g.away)}" alt=""><span>AT</span><img src="${logo(g.home)}" alt=""></div>`).join('');
  return `
    <div class="top"><span>${esc(d.kicker || '')}</span>${brand()}</div>
    ${d.eyebrow ? `<div class="eyebrow">${esc(d.eyebrow)}</div>` : ''}
    <div class="big2">${d.title_html || ''}</div>
    ${d.sub ? `<div class="sub" style="font-size:28px;max-width:1000px">${esc(d.sub)}</div>` : ''}
    ${games ? `<div class="games">${games}</div>` : ''}
    ${foot(d.foot)}`;
}

// "Our model 66% + books 74%" -> two labelled numbers; anything else falls back to plain text
function source(d) {
  const s = String(d.source || '');
  const pct = '(\\d{1,3}(?:\\.\\d+)?\\s?%)';
  const m = s.match(new RegExp('model\\s*[:=]?\\s*' + pct, 'i'));
  const b = s.match(new RegExp("books?['\\u2019]?\\s*[:=]?\\s*" + pct, 'i'));
  const item = (k, v, cls) => `<div><div class="lab">${k}</div><div class="v ${cls}">${esc(v)}</div></div>`;
  if (m && b) {
    return `<div class="src">${item('Our model', m[1].replace(/\s/g, ''), 'ours')}${item('Books', b[1].replace(/\s/g, ''), 'ext')}${d.odds ? item('Odds', d.odds, 'ext') : ''}</div>`;
  }
  const odds = d.odds ? `<div class="src">${item('Odds', d.odds, 'ext')}</div>` : '';
  return `<div style="display:flex;align-items:flex-end;gap:32px">${s ? `<div class="srctext">${esc(s)}</div>` : ''}${odds}</div>`;
}

function match(d) {
  const [ca, ch] = colors(d.away, d.home);
  const pa = d.away_prob, ph = 1 - d.away_prob, pickHome = ph >= .5;
  const city = c => (TEAMS[c] || [, , , ''])[3];
  const sub = (c, s) => [city(c), s].filter(Boolean).map(esc).join(' · ');
  return `
    <div class="stripe"><i style="background:${ca}"></i><i style="background:${ch}"></i></div>
    <div class="top"><span>${esc(d.when)}</span>${brand()}</div>
    <div class="teams">
      <div class="team"><img src="${logo(d.away)}" alt=""><div><div class="tname">${esc(tname(d.away))}</div><div class="tsub">${sub(d.away, d.away_sub || 'away')}</div></div></div>
      <div class="vs">AT</div>
      <div class="team home"><img src="${logo(d.home)}" alt=""><div><div class="tname">${esc(tname(d.home))}</div><div class="tsub">${sub(d.home, d.home_sub || 'home')}</div></div></div>
    </div>
    <div class="bar">
      <div class="a ${pickHome ? 'lose' : ''}" style="flex:${(pa * 100).toFixed(1)} 1 0;background:${ca}"><span>${Math.round(pa * 100)}%</span></div>
      <div class="h ${pickHome ? '' : 'lose'}" style="flex:${(ph * 100).toFixed(1)} 1 0;background:${ch}"><span>${Math.round(ph * 100)}%</span></div>
    </div>
    ${(d.tape || []).length ? `<div class="tape" style="--ac:${ca};--hc:${ch}">${d.tape.slice(0, 4).map(t =>
      `<div><div class="lab">${esc(t.label)}</div><div class="v"><span>${esc(t.away)}</span><span>${esc(t.home)}</span></div></div>`).join('')}</div>` : ''}
    <div class="pick">
      <div><div class="lab">Our pick</div><div class="who">${esc(d.pick_name)}<em>${Math.round(Math.max(pa, ph) * 100)}%</em></div></div>
      ${source(d)}
    </div>
    ${foot()}`;
}

// "ROCKETS BY 10.7": the size of the edge, in the units of the first metric
function gapLine(r) {
  if (!r) return '';
  const a = +r.a.value, b = +r.b.value;
  const aWins = r.lower_is_better ? a <= b : a >= b;
  const win = aWins ? r.a : r.b, lose = aWins ? r.b : r.a;
  const num = x => parseFloat(String(x.label).replace(/[^0-9.\-+]/g, ''));
  const diff = Math.abs(num(win) - num(lose));
  if (!isFinite(diff) || diff === 0) return '';
  const dec = (String(win.label).split('.')[1] || '').replace(/[^0-9]/g, '').length;
  const unit = /%$/.test(String(win.label)) ? ' pts' : '';
  return `<div class="gap">${esc(tname(win.team))} by ${diff.toFixed(dec)}${unit}</div>`;
}

function edge(d) {
  const [ca, ch] = colors(d.away, d.home);
  const col = { [d.away]: ca, [d.home]: ch };
  const rows = (d.rows || []).slice(0, 2).map((r, i) => {
    const a = +r.a.value, b = +r.b.value;
    const aWins = r.lower_is_better ? a <= b : a >= b;
    const box = (x, win) => `<div class="dv ${win ? '' : 'lose'}" style="background:${col[x.team] || '#444'}">
      <span class="t">${esc(x.team)}</span><span class="n">${esc(x.label)}</span></div>`;
    const g = i === 0 ? gapLine(r) : '';
    return `<div class="drow"><div class="head">${g || '<span></span>'}<span class="lab">${esc(r.label)}</span></div><div class="dpair">${box(r.a, aWins)}${box(r.b, !aWins)}</div></div>`;
  }).join('');
  // "Reason 1 of 3 · Rockets": counter in orange, team in muted
  const eb = String(d.eyebrow || '').split(' · ');
  const eyebrow = eb[0] ? `${esc(eb[0])}${eb.length > 1 ? ` <span>· ${esc(eb.slice(1).join(' · '))}</span>` : ''}` : '';
  return `
    <div class="stripe"><i style="background:${ca}"></i><i style="background:${ch}"></i></div>
    <div class="top"><span>${esc(d.matchup)}</span>${brand()}</div>
    ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
    <div class="title">${esc(d.title)}</div>
    ${d.sub ? `<div class="sub">${esc(d.sub)}</div>` : ''}
    <div class="duel">${rows}</div>
    ${foot()}`;
}

function recap(d) {
  const stat = (k, v) => `<div class="stat"><div class="lab">${esc(k)}</div><div class="v">${esc(v)}</div></div>`;
  return `
    <div class="top"><span>${esc(d.period)}</span>${brand()}</div>
    <div class="eyebrow">${esc(d.eyebrow || 'Weekly record')}</div>
    <div class="rec">
      <div class="big">${esc(d.wins)}<i>–</i>${esc(d.losses)}</div>
      ${d.hit_rate ? `<div class="rate"><div class="lab">Hit rate</div><div class="v">${esc(d.hit_rate)}</div>${d.expected ? `<div class="x">vs ${esc(d.expected)} expected</div>` : ''}</div>` : ''}
    </div>
    <div class="stats">
      ${stat('Season', d.season || '–')}
      ${stat(d.best_label || 'Best call', d.best || '–')}
    </div>
    ${foot('Every pick graded')}`;
}

// "ranking": a top list (power rankings, best records, numbers of the season), up to 10 rows in 2 columns
function ranking(d) {
  const rows = (d.rows || []).slice(0, 10);
  const half = Math.ceil(rows.length / 2);
  const row = (r, i) => `<div class="r ${i < 3 ? 'podium' : ''}"><span class="n">${d.numbered === false ? '' : i + 1}</span>
      <img src="${logo(r.team)}" alt=""><span class="t">${esc(r.name || tname(r.team))}${r.note ? `<small>${esc(r.note)}</small>` : ''}</span>
      <span class="v">${esc(r.value)}</span></div>`;
  const col = list => `<div>${list.map((r, k) => row(r, rows.indexOf(r))).join('')}</div>`;
  return `
    <div class="top"><span>${esc(d.kicker || '')}</span>${brand()}</div>
    <div class="eyebrow">${esc(d.eyebrow || '')}</div>
    <div class="rk-title">${d.title_html || esc(d.title || '')}</div>
    <div class="rk ${rows.length <= 6 ? 'few' : ''}">${col(rows.slice(0, half))}${col(rows.slice(half))}</div>
    ${foot(d.foot)}`;
}

function decode() {
  if (window.__CARD__) return window.__CARD__;
  const h = location.hash.slice(1);
  if (!h) return null;
  const b64 = h.replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

(async () => {
  const d = decode();
  const el = document.getElementById('card');
  if (!d) { el.innerHTML = '<div class="title">No data</div>'; return; }
  el.innerHTML = d.type === 'ranking' ? ranking(d) : d.type === 'announce' ? announce(d) : d.type === 'match' ? match(d) : d.type === 'recap' ? recap(d) : edge(d);
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  window.__READY__ = true;
})();
</script>
</body>
</html>
