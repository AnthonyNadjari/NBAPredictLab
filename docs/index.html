<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict Lab · Console</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E2601B'/%3E%3Cpath d='M2 16h28M16 2v28M6 6c6 5 6 15 0 20M26 6c-6 5-6 15 0 20' stroke='%230E1726' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --floor: #EEF1F5;
  --card: #FFFFFF;
  --ink: #0E1726;
  --muted: #5B6B82;
  --line: #D9E0E9;
  --ball: #E2601B;
  --ball-ink: #FFFFFF;
  --win: #18875A;
  --loss: #C8372F;
  --wash: #F6F8FB;
  --shadow: 0 1px 2px rgba(14, 23, 38, .06), 0 4px 16px rgba(14, 23, 38, .05);
  --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --floor: #0C121C; --card: #141C29; --ink: #E8EDF4; --muted: #8C9BB0; --line: #253042;
    --ball: #F07431; --wash: #192233; --win: #3DBA84; --loss: #EE6A5F;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --floor: #0C121C; --card: #141C29; --ink: #E8EDF4; --muted: #8C9BB0; --line: #253042;
  --ball: #F07431; --wash: #192233; --win: #3DBA84; --loss: #EE6A5F;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--floor); color: var(--ink);
  font: 15px/1.5 var(--sans);
}
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* ---------- top bar ---------- */
header.top { padding: 22px 0 0; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  font: 800 34px/1 var(--display); letter-spacing: .5px; margin: 0; text-transform: uppercase;
}
.brand h1 span { color: var(--ball); }
.brand .sub { color: var(--muted); font-size: 13px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.health { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--win); } .dot.bad { background: var(--loss); } .dot.warn { background: var(--ball); } .dot.run { background: var(--ball); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.btn {
  border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }

nav.tabs { display: flex; gap: 4px; margin: 22px 0 0; border-bottom: 1px solid var(--line); }
nav.tabs button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted);
  font: 600 19px/1 var(--display); text-transform: uppercase; letter-spacing: .6px;
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ball); }

main { padding: 22px 0 60px; }
section[hidden] { display: none; }

/* ---------- slate ---------- */
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 12px; flex-wrap: wrap; }
.day-head h2 { font: 800 26px/1.1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .4px; }
.day-head .count { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-bottom: 30px; }

.game {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
}
.game.published { border-color: color-mix(in srgb, var(--win) 45%, var(--line)); }
.g-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); }
.g-top .time { font-family: var(--mono); color: var(--ink); }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--wash); color: var(--muted); }
.chip.pub { background: color-mix(in srgb, var(--win) 15%, transparent); color: var(--win); }
.chip.launch { background: color-mix(in srgb, var(--ball) 15%, transparent); color: var(--ball); }
.chip.fail { background: color-mix(in srgb, var(--loss) 15%, transparent); color: var(--loss); cursor: help; }

.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.team.home { flex-direction: row-reverse; text-align: right; }
.team img { width: 34px; height: 34px; object-fit: contain; flex: none; }
.team .nm { font-weight: 600; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.team .where { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.at { color: var(--muted); font: 500 13px var(--mono); }

/* signature: the tug-of-war bar in real team colours */
.tug { position: relative; }
.tug-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--wash); }
.tug-bar > div { display: flex; align-items: center; transition: flex-basis .7s cubic-bezier(.2,.8,.2,1); }
.tug-bar .a { justify-content: flex-start; padding-left: 9px; }
.tug-bar .h { justify-content: flex-end; padding-right: 9px; }
.tug-bar span { font: 800 19px/1 var(--display); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); letter-spacing: .3px; }
.tug-bar .loser span { opacity: .8; font-weight: 600; font-size: 15px; }
.tug .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--card); transform: translateX(-1px); }
@media (prefers-reduced-motion: reduce) { .tug-bar > div { transition: none; } .dot.run { animation: none; } }

.pick { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pick .who { font-weight: 600; }
.pick .who small { color: var(--muted); font-weight: 400; }
.split { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.split b { color: var(--ink); font-weight: 500; }
.warn { font-size: 12px; color: var(--ball); }
.g-actions { display: flex; gap: 8px; margin-top: 2px; }
.g-actions .btn { flex: 1; justify-content: center; }

.empty {
  background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 22px; text-align: center;
}
.empty h3 { font: 800 26px/1.1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
.empty p { margin: 0; color: var(--muted); }

/* ---------- record ---------- */
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 4px; font: 800 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .4px; }
.panel .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.scoreline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.scoreline .big { font: 800 64px/0.95 var(--display); letter-spacing: 1px; }
.scoreline .big i { font-style: normal; color: var(--muted); padding: 0 4px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.kv div { background: var(--wash); border-radius: 8px; padding: 10px; }
.kv dt { font-size: 11.5px; color: var(--muted); }
.kv dd { margin: 2px 0 0; font: 500 18px var(--mono); }
.chart { width: 100%; height: auto; display: block; }
.chart text { font: 11px var(--mono); fill: var(--muted); }
.results { list-style: none; margin: 0; padding: 0; }
.results li { display: grid; grid-template-columns: 22px 64px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.results li:last-child { border-bottom: 0; }
.results .mk { font-weight: 700; text-align: center; }
.results .ok { color: var(--win); } .results .ko { color: var(--loss); }
.results .d { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.results .sc { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* ---------- control ---------- */
.ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 820px) { .ctl { grid-template-columns: 1fr; } }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row input[type="time"] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); }
.runs { list-style: none; margin: 0; padding: 0; }
.runs li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.runs li:last-child { border-bottom: 0; }
.runs .meta { color: var(--muted); font-size: 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--mono); font-size: 13px; }
.lockbox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lockbox input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-width: 200px; }
.msg { font-size: 13px; margin-top: 8px; min-height: 1em; }
.msg.err { color: var(--loss); } .msg.ok { color: var(--win); }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--card); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
}
dialog::backdrop { background: rgba(8, 12, 20, .55); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
.dlg-head h3 { margin: 0; font: 800 20px var(--display); text-transform: uppercase; }
.dlg-body { padding: 14px 18px; overflow: auto; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.tweet { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.tw-edit { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--wash); font: 14px/1.45 var(--sans); resize: vertical; }
.cardwrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; margin-top: 8px; background: #0E1726; }
.cardwrap iframe { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; border: 0; transform-origin: 0 0; transform: scale(var(--s, .4)); pointer-events: none; }
.tweet .n { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); margin-bottom: 4px; }
.tweet .n .over { color: var(--loss); }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--floor);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 10; max-width: calc(100vw - 32px);
}
footer { color: var(--muted); font-size: 12px; padding: 0 0 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topline">
      <div class="brand">
        <h1>Predict<span>Lab</span></h1>
        <span class="sub">Console du bot NBA</span>
      </div>
      <button class="btn small" id="lockBtn" type="button">Déverrouiller</button>
    </div>
    <div class="health" id="health"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="slate">Matchs</button>
      <button role="tab" aria-selected="false" data-tab="record">Bilan</button>
      <button role="tab" aria-selected="false" data-tab="account">Compte X</button>
      <button role="tab" aria-selected="false" data-tab="control">Pilotage</button>
    </nav>
  </header>

  <main>
    <section id="slate" role="tabpanel"></section>
    <section id="record" role="tabpanel" hidden></section>
    <section id="account" role="tabpanel" hidden></section>
    <section id="control" role="tabpanel" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>

<dialog id="threadDlg">
  <div class="dlg-head"><h3 id="threadTitle">Thread</h3><button class="btn small" type="button" data-close>Fermer</button></div>
  <div class="dlg-body" id="threadBody"></div>
  <div class="dlg-foot" id="threadFoot"></div>
</dialog>

<dialog id="lockDlg">
  <div class="dlg-head"><h3>Déverrouiller</h3><button class="btn small" type="button" data-close>Fermer</button></div>
  <form class="dlg-body" id="lockForm">
    <p style="margin:0 0 10px;color:var(--muted);font-size:14px">Le mot de passe donne accès à la publication et au pilotage. Il reste en mémoire jusqu'à la fermeture de l'onglet.</p>
    <div class="lockbox">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Mot de passe" required>
      <button class="btn primary" type="submit">Déverrouiller</button>
    </div>
    <div class="msg" id="lockMsg"></div>
  </form>
</dialog>

<script>
// Vercel app hosting the api/ functions (publish, admin, update-schedule)
const API = 'https://nba-predict-lab.vercel.app/api';
const REPO_URL = 'https://github.com/AnthonyNadjari/NBAPredictLab';

const TEAMS = {
  ATL: ['Atlanta Hawks', '#E03A3E', 'atl'], BOS: ['Boston Celtics', '#007A33', 'bos'],
  BKN: ['Brooklyn Nets', '#1B1B1B', 'bkn'], CHA: ['Charlotte Hornets', '#1D1160', 'cha'],
  CHI: ['Chicago Bulls', '#CE1141', 'chi'], CLE: ['Cleveland Cavaliers', '#860038', 'cle'],
  DAL: ['Dallas Mavericks', '#00538C', 'dal'], DEN: ['Denver Nuggets', '#0E2240', 'den'],
  DET: ['Detroit Pistons', '#C8102E', 'det'], GSW: ['Golden State Warriors', '#1D428A', 'gs'],
  HOU: ['Houston Rockets', '#CE1141', 'hou'], IND: ['Indiana Pacers', '#002D62', 'ind'],
  LAC: ['LA Clippers', '#C8102E', 'lac'], LAL: ['Los Angeles Lakers', '#552583', 'lal'],
  MEM: ['Memphis Grizzlies', '#5D76A9', 'mem'], MIA: ['Miami Heat', '#98002E', 'mia'],
  MIL: ['Milwaukee Bucks', '#00471B', 'mil'], MIN: ['Minnesota Timberwolves', '#0C2340', 'min'],
  NOP: ['New Orleans Pelicans', '#0C2340', 'no'], NYK: ['New York Knicks', '#F58426', 'ny'],
  OKC: ['Oklahoma City Thunder', '#007AC1', 'okc'], ORL: ['Orlando Magic', '#0077C0', 'orl'],
  PHI: ['Philadelphia 76ers', '#006BB6', 'phi'], PHX: ['Phoenix Suns', '#1D1160', 'phx'],
  POR: ['Portland Trail Blazers', '#E03A3E', 'por'], SAC: ['Sacramento Kings', '#5A2D81', 'sac'],
  SAS: ['San Antonio Spurs', '#6E7378', 'sa'], TOR: ['Toronto Raptors', '#CE1141', 'tor'],
  UTA: ['Utah Jazz', '#002B5C', 'utah'], WAS: ['Washington Wizards', '#002B5C', 'wsh'],
};
// Second colours for clashes (both teams red, both navy...)
const ALT = { ATL: '#C1D32F', CHI: '#000000', HOU: '#000000', TOR: '#000000', DET: '#1D42BA', LAC: '#1D428A',
  POR: '#000000', MIN: '#78BE20', NOP: '#C8102E', UTA: '#F9A01B', WAS: '#E31837', CHA: '#00788C', PHX: '#E56020',
  DEN: '#FEC524', IND: '#FDBB30', BKN: '#707271', SAS: '#000000', MIA: '#F9A01B', CLE: '#FDBB30' };

const state = { games: null, dash: null, pw: null, runs: null, cron: null, launched: new Set(), launchedAt: {}, publog: [] };
try { state.pw = sessionStorage.getItem('pl_pw'); } catch (e) {}
try {
  state.launchedAt = JSON.parse(localStorage.getItem('pl_launched_at') || '{}') || {};
  // a click with no outcome after 20 min is forgotten (the button comes back)
  state.launched = new Set(Object.keys(state.launchedAt).filter(id => Date.now() - state.launchedAt[id] < 20 * 60000));
} catch (e) {}
function saveLaunched() {
  const keep = {};
  for (const id of state.launched) keep[id] = state.launchedAt[id] || Date.now();
  try { localStorage.setItem('pl_launched_at', JSON.stringify(keep)); } catch (e) {}
}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (p, d = 0) => p == null ? '–' : (p * 100).toFixed(d) + ' %';
const paris = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
const parisDay = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', weekday: 'short', day: 'numeric', month: 'short' });
const longDay = d => new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z'));

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}

function ago(iso) {
  if (!iso) return '–';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 36) return `il y a ${h} h`;
  return `il y a ${Math.round(h / 24)} j`;
}

function hexDist(a, b) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}
function colors(away, home) {
  let ca = (TEAMS[away] || [, '#888'])[1], ch = (TEAMS[home] || [, '#444'])[1];
  if (hexDist(ca, ch) < 90) ca = ALT[away] || '#7A8699';
  return [ca, ch];
}
const logo = code => `https://a.espncdn.com/i/teamlogos/nba/500/${(TEAMS[code] || [, , code.toLowerCase()])[2]}.png`;

async function getJSON(url) {
  const r = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}
async function api(path, body) {
  const r = await fetch(`${API}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, password: state.pw }) });
  let js = {};
  try { js = await r.json(); } catch (e) {}
  if (r.status === 401) { setPw(null); throw new Error('Mot de passe refusé. Déverrouille à nouveau.'); }
  if (!r.ok || !js.success) throw new Error(js.error || `Erreur serveur (${r.status})`);
  return js;
}
function setPw(pw) {
  state.pw = pw;
  try { pw ? sessionStorage.setItem('pl_pw', pw) : sessionStorage.removeItem('pl_pw'); } catch (e) {}
  $('#lockBtn').textContent = pw ? 'Verrouiller' : 'Déverrouiller';
}

// ---------------- health strip ----------------
function renderHealth() {
  const d = state.dash, g = state.games, el = $('#health');
  const pills = [];
  const gen = g?.generated_at || d?.generated_at;
  const fresh = gen && (Date.now() - new Date(gen)) < 30 * 3600e3;
  pills.push(`<span class="pill"><span class="dot ${gen ? (fresh ? 'ok' : 'bad') : ''}"></span>Données <b>${gen ? ago(gen) : 'absentes'}</b></span>`);
  if (state.runs) {
    const last = state.runs.find(r => r.workflow === 'Daily NBA Predictions');
    if (last) {
      const cls = last.status !== 'completed' ? 'run' : last.conclusion === 'success' ? 'ok' : 'bad';
      const label = last.status !== 'completed' ? 'en cours' : last.conclusion === 'success' ? 'réussi' : 'échec';
      pills.push(`<span class="pill"><span class="dot ${cls}"></span>Dernier run <b>${label}</b> · ${ago(last.created_at)}</span>`);
    }
  }
  const fol = (state.vstats || []).filter(x => x.followers != null);
  if (fol.length) {
    const dd = delta(fol, 7);
    pills.push(`<span class="pill">Followers <b>${fol[fol.length - 1].followers}</b>${dd != null ? ` · ${dd >= 0 ? '+' : ''}${dd} sur 7 j` : ''}</span>`);
  }
  if (state.xstatus && state.xstatus.ok === false) pills.push(`<span class="pill"><span class="dot bad"></span>API X en erreur</span>`);
  if (d?.season?.n) pills.push(`<span class="pill">Saison <b>${d.season.correct}–${d.season.n - d.season.correct}</b> · ${pct(d.season.accuracy, 1)}</span>`);
  if (d?.next_slate && !(g?.games || []).length) pills.push(`<span class="pill">Prochaine soirée <b>${longDay(d.next_slate.date)}</b></span>`);
  el.innerHTML = pills.join('');
}

// ---------------- publishing outcome (docs/vision/publish_log.json, written by the server) ----------------
function lastPublish(id) {
  const e = (state.publog || []).filter(x => x.game_id === id && !x.dry_run);
  return e[e.length - 1] || null;
}
function pubChip(g) {
  const last = lastPublish(g.id);
  if (g.published && last && last.uncertain)
    return `<span class="chip fail" title="${esc(last.error || '')}">À vérifier sur X</span>`;
  if (g.published) return `<span class="chip pub">Publié</span>`;
  if (state.launched.has(g.id)) return `<span class="chip launch">Publication lancée</span>`;
  if (last && !last.ok) return `<span class="chip fail" title="${esc(last.error || '')}">Échec de publication</span>`;
  return `<span class="chip">À publier</span>`;
}

// ---------------- slate ----------------
function gameCard(g) {
  const a = g.away_code, h = g.home_code;
  const pa = g.predicted_away_prob, ph = g.predicted_home_prob;
  const [ca, ch] = colors(a, h);
  const pickHome = ph >= .5;
  const status = pubChip(g);
  const t = g.start_utc ? new Date(g.start_utc) : null;
  const when = t ? `<span class="time">${paris.format(t)}</span> · ${parisDay.format(t)}` : '';
  const mk = g.market_home_prob, md = g.model_home_prob;
  const pickP = pickHome ? ph : pa;
  const side = p => pickHome ? p : 1 - p;
  const disagree = mk != null && md != null && (mk >= .5) !== (md >= .5);
  const pickName = (TEAMS[pickHome ? h : a] || [g.predicted_winner])[0];
  const src = g.probability_source === 'market' ? 'consensus des cotes' : 'modèle stats (pas de cotes)';
  return `
  <article class="game ${g.published ? 'published' : ''}" data-id="${esc(g.id)}">
    <div class="g-top"><div>${when}${g.refreshed_at ? ` · <span title="Heure de la dernière mise à jour de la probabilité">màj ${paris.format(new Date(g.refreshed_at))}</span>` : ''}</div>${status}</div>
    <div class="teams">
      <div class="team"><img src="${logo(a)}" alt="" loading="lazy"><div class="nm">${esc(TEAMS[a]?.[0] || g.away_team)}<span class="where">extérieur</span></div></div>
      <div class="at">@</div>
      <div class="team home"><img src="${logo(h)}" alt="" loading="lazy"><div class="nm">${esc(TEAMS[h]?.[0] || g.home_team)}<span class="where">domicile</span></div></div>
    </div>
    <div class="tug" role="img" aria-label="${esc(TEAMS[a]?.[0])} ${pct(pa)}, ${esc(TEAMS[h]?.[0])} ${pct(ph)}">
      <div class="tug-bar">
        <div class="a ${pickHome ? 'loser' : ''}" style="flex-basis:${(pa * 100).toFixed(1)}%;background:${ca}"><span>${Math.round(pa * 100)}</span></div>
        <div class="h ${pickHome ? '' : 'loser'}" style="flex-basis:${(ph * 100).toFixed(1)}%;background:${ch}"><span>${Math.round(ph * 100)}</span></div>
      </div>
      <div class="mid"></div>
    </div>
    <div class="pick">
      <div class="who">${esc(pickName)} <small>${pct(pickP)} · ${src}</small></div>
    </div>
    <div class="split">
      ${mk != null ? `<span>Marché <b>${pct(side(mk))}</b></span>` : ''}
      ${md != null ? `<span>Modèle <b>${pct(side(md))}</b></span>` : ''}
      ${mk != null ? `<span>Cotes <b>${(+g.away_odds).toFixed(2)}</b> / <b>${(+g.home_odds).toFixed(2)}</b></span>` : `<span>Pas encore de cotes</span>`}
    </div>
    ${disagree ? `<div class="warn">Le modèle stats et le marché ne choisissent pas la même équipe.</div>` : ''}
    <div class="g-actions">
      <button class="btn small" type="button" data-act="preview">Aperçu du thread</button>
      ${g.published && g.tweet_url ? `<a class="btn small" href="${esc(g.tweet_url)}" target="_blank" rel="noopener">Voir sur X</a>`
        : `<button class="btn small primary" type="button" data-act="publish" ${g.published || state.launched.has(g.id) ? 'disabled' : ''}>${g.published ? 'Déjà publié' : 'Publier'}</button>`}
    </div>
  </article>`;
}

function renderSlate() {
  const el = $('#slate');
  if (!state.games) { el.innerHTML = `<div class="empty"><h3>Chargement…</h3></div>`; return; }
  const all = state.games.games || [];
  const specials = (state.games.specials || []).map(sp => `
    <article class="game ${sp.published ? 'published' : ''}" data-id="${esc(sp.id)}">

      <div class="hint" style="margin:0">${esc(((sp.thread || [])[0] || {}).text ? sp.thread[0].text.split(String.fromCharCode(10))[2] || '' : '')}</div>
      <div class="g-actions"><button class="btn small" type="button" data-act="preview">Aperçu</button>

    </article>`).join('');
  const specialsBlock = specials ? `<div class="day-head"><h2>Posts du jour</h2></div><div class="grid">${specials}</div>` : '';
  if (!all.length) {

}

function findGame(id) { return [...(state.games?.games || []), ...(state.games?.specials || [])].find(g => g.id === id); }

// research/h6_timing: the morning price is opening-line quality; the 21:00 UTC refresh
// (injury reports in) captures ~80% of the accuracy gain. Published probabilities are frozen.
function timingAdvice(g) {
  if (!g.refreshed_at || g.published || g.type === 'weekly') return '';
  const ref = new Date(g.refreshed_at), now = new Date();
  const evening = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 21, 0));
  const tip = g.start_utc ? new Date(g.start_utc) : null;
  if (ref >= evening || now >= evening || (tip && tip <= evening)) return '';
  return `<p class="warn" style="margin:0 0 10px">Probabilité du matin (${paris.format(ref)}), au niveau de la cote d'ouverture. La mise à jour de ${paris.format(evening)} intègre les rapports de blessures et vise plus juste (≈ +5 bons picks par saison). Publier maintenant fige cette probabilité.</p>`;
}

function threadOf(g) {
  if (Array.isArray(g.thread) && g.thread.length) return g.thread;
  return (g.thread_preview || []).map(t => ({ text: t, card: null }));
}
function cardSrc(card) {
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(card)))).replace(/\+/g, '-').replace(/\//g, '_');
  return `cards/card.html#${b64}`;
}
function fitCards(root) {
  root.querySelectorAll('.cardwrap').forEach(w => w.style.setProperty('--s', w.clientWidth / 1200));
}

function openThread(g, publishMode) {
  const tw = threadOf(g);
  $('#threadTitle').textContent = publishMode ? 'Publier ce thread ?' : 'Aperçu du thread';
  $('#threadBody').innerHTML = timingAdvice(g) + (tw.length ? tw.map((t, i) => `
    <div class="tweet">
      <div class="n"><span>Tweet ${i + 1}/${tw.length}</span><span class="cnt" data-i="${i}">${t.text.length}/280</span></div>
      <textarea class="tw-edit" data-i="${i}" rows="${Math.min(9, t.text.split('\n').length + 1)}" ${g.published ? 'readonly' : ''}>${esc(t.text)}</textarea>
      ${t.card ? `<div class="cardwrap"><iframe src="${cardSrc(t.card)}" title="Image du tweet ${i + 1}" loading="lazy" tabindex="-1"></iframe></div>` : ''}
    </div>`).join('')
    + `<p style="color:var(--muted);font-size:13px;margin:4px 0 0">Tu peux modifier chaque tweet avant de publier. Vider un tweet le retire du thread. Les images sont exactement celles qui seront postées.</p>`
    : `<p>Aperçu indisponible pour ce match. Le thread sera généré à la publication.</p>`);
  const body = $('#threadBody');
  body.querySelectorAll('.tw-edit').forEach(ta => ta.addEventListener('input', () => {
    const c = body.querySelector(`.cnt[data-i="${ta.dataset.i}"]`);
    c.textContent = `${ta.value.length}/280`;
    c.classList.toggle('over', ta.value.length > 280);
  }));
  $('#threadFoot').innerHTML = g.published
    ? `${g.tweet_url ? `<a class="btn" href="${esc(g.tweet_url)}" target="_blank" rel="noopener">Voir sur X</a>` : ''}<button class="btn" type="button" data-close>Fermer</button>`
    : `<button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" id="confirmPublish">Publier sur X</button>`;
  const dlg = $('#threadDlg');
  dlg.showModal();
  requestAnimationFrame(() => fitCards(body));
  $('#confirmPublish')?.addEventListener('click', async e => {
    if (!state.pw) { dlg.close(); openLock(() => openThread(g, true)); return; }
    const edited = [...body.querySelectorAll('.tw-edit')].map(ta => ta.value);
    if (edited.some(t => t.length > 280)) { toast('Un tweet dépasse 280 caractères.'); return; }
    const changed = edited.some((t, i) => t !== tw[i].text);
    e.target.disabled = true; e.target.textContent = 'Envoi…';
    try {
      await api('publish', changed ? { game_id: g.id, texts: edited } : { game_id: g.id });
      state.launched.add(g.id); state.launchedAt[g.id] = Date.now(); saveLaunched();
      dlg.close(); renderSlate();
      toast('Publication lancée. Le thread part sur X dans 2 à 5 minutes.');
    } catch (err) {
      e.target.disabled = false; e.target.textContent = 'Publier sur X';
      toast(err.message);
    }
  });
}
window.addEventListener('resize', () => { const d = $('#threadDlg'); if (d.open) fitCards(d); });

function startPublish(g) {
  if (!state.pw) { openLock(() => openThread(g, true)); return; }
  openThread(g, true);
}

$('#slate').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const g = findGame(b.closest('.game').dataset.id);
  if (!g) return;
  b.dataset.act === 'preview' ? openThread(g, false) : startPublish(g);
});

// ---------------- record ----------------
function calibrationSVG(buckets) {
  const W = 460, H = 220, L = 34, B = 26, T = 10, R = 8;
  const x = p => L + (p - .5) / .5 * (W - L - R);
  const y = p => T + (1 - (p - .3) / .7) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration : taux de réussite réel par tranche de probabilité">`;
  for (const v of [.4, .6, .8, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}</text>`;
  s += `<line x1="${x(.5)}" y1="${y(.5)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const bw = 26;
  for (const b of buckets) {
    const cx = x(b.expected);
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${b.label.split('–')[0]}</text>`;
    if (b.actual == null || !b.n) continue;
    s += `<rect x="${cx - bw / 2}" y="${y(b.actual)}" width="${bw}" height="${y(.3) - y(b.actual)}" rx="3" fill="var(--ball)" opacity=".85"><title>${b.label} : ${pct(b.actual, 1)} réussis sur ${b.n}</title></rect>`;
    s += `<text x="${cx}" y="${y(b.actual) - 5}" text-anchor="middle">${b.n}</text>`;
  }
  return s + `</svg>`;
}

function cumulativeSVG(daily) {
  const W = 460, H = 160, L = 34, B = 22, T = 10, R = 8;
  let n = 0, c = 0;
  const pts = daily.map(d => { n += d.n; c += d.correct; return { d: d.date, a: c / n }; });
  if (pts.length < 2) return '';
  const x = i => L + i / (pts.length - 1) * (W - L - R);
  const y = p => T + (1 - (p - .4) / .45) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Taux de réussite cumulé sur la saison">`;
  for (const v of [.5, .6, .7, .8]) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}</text>`;
  s += `<polyline fill="none" stroke="var(--ball)" stroke-width="2.5" points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(Math.min(Math.max(p.a, .4), .85)).toFixed(1)}`).join(' ')}"/>`;
  s += `<text x="${L}" y="${H - 4}">${pts[0].d.slice(5)}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${pts[pts.length - 1].d.slice(5)}</text>`;
  return s + `</svg>`;
}

function renderRecord() {
  const el = $('#record'), d = state.dash;
  if (!d) { el.innerHTML = `<div class="empty"><h3>Chargement…</h3></div>`; return; }
  const s = d.season, prev = d.previous_season, bt = d.backtest;
  const has = s.n > 0;
  const main = has ? `
    <div class="scoreline"><div class="big">${s.correct}<i>–</i>${s.n - s.correct}</div>
      <div><div style="font:500 22px var(--mono)">${pct(s.accuracy, 1)}</div><div class="hint" style="margin:0">attendu : ${pct(s.expected, 1)}</div></div></div>
    <dl class="kv">
      <div><dt>Matchs</dt><dd>${s.n}</dd></div>
      <div><dt>Brier (↓ mieux)</dt><dd>${s.brier.toFixed(3)}</dd></div>
      <div><dt>Mise 1 u./pick</dt><dd>${s.flat_bets ? (s.flat_bets.units >= 0 ? '+' : '') + s.flat_bets.units + ' u.' : '–'}</dd></div>
    </dl>
    <div style="margin-top:16px">${cumulativeSVG(s.daily)}</div>`
    : `<div class="scoreline"><div class="big">0<i>–</i>0</div></div>
       <p class="hint" style="margin-top:10px">La saison ${esc(s.label)} n'a pas encore de résultat. Le bilan démarre au premier match joué.</p>
       <dl class="kv">
         <div><dt>Backtest marché</dt><dd>${pct(bt.market_accuracy, 1)}</dd></div>
         <div><dt>Backtest modèle</dt><dd>${pct(bt.model_accuracy, 1)}</dd></div>
         <div><dt>Ancien moteur 25-26</dt><dd>${pct(prev.accuracy, 1)}</dd></div>
       </dl>
       <p class="hint" style="margin-top:12px">Backtest ${esc(bt.seasons)} : chaque saison prédite sans connaître ses résultats.</p>`;
  const buckets = has ? s.buckets : prev.buckets;
  el.innerHTML = `
  <div class="cols">
    <div class="panel"><h3>Saison ${esc(s.label)}</h3><p class="hint">Picks résolus depuis le ${longDay(s.since)}.</p>${main}</div>
    <div class="panel"><h3>Les probabilités tiennent-elles ?</h3>
      <p class="hint">Barres : % de picks gagnés par tranche de confiance${has ? '' : ' (saison 2025-26, ancien moteur)'}. Pointillés : ce qu'un modèle bien calibré obtiendrait. Le chiffre au-dessus = nombre de matchs.</p>
      ${calibrationSVG(buckets)}</div>
  </div>
  <div class="panel" style="margin-top:12px"><h3>Derniers résultats</h3>
    ${d.recent.length ? `<ul class="results">${d.recent.map(r => `<li><span class="mk ${r.correct ? 'ok' : 'ko'}">${r.correct ? '✓' : '✗'}</span><span class="d">${r.date.slice(5)}</span>
      <span>${esc(r.away)} @ ${esc(r.home)} · pick <b>${esc(r.pick)}</b> ${pct(r.p)}</span><span class="sc">${esc(r.score || '')}</span></li>`).join('')}</ul>`
      : `<p class="hint" style="margin:0">Aucun résultat cette saison pour l'instant.</p>`}
  </div>`;
}

  const d = new Date(); d.setUTCHours(+m[2], +m[1], 0, 0);
  return paris.format(d);
}

  <div class="panel" style="margin-top:12px"><h3>Données</h3>${facts}</div>`;

  $('#runNow').onclick = async e => {
    const b = e.target; b.disabled = true; $('#runMsg').className = 'msg'; $('#runMsg').textContent = 'Démarrage…';
    try { await api('admin', { action: 'run' }); $('#runMsg').className = 'msg ok'; $('#runMsg').textContent = 'Run lancé. Recharge la page dans 3 minutes.'; setTimeout(loadStatus, 5000); }
    catch (err) { $('#runMsg').className = 'msg err'; $('#runMsg').textContent = err.message; }
    b.disabled = false;
  };
  $('#schedForm').onsubmit = async e => {
    e.preventDefault();
    const [hh, mm] = $('#schedTime').value.split(':').map(Number);
    // Paris wall-clock -> UTC using today's offset (cron itself is UTC)
    const probe = new Date(); probe.setUTCHours(12, 0, 0, 0);
    const offset = (+paris.format(probe).slice(0, 2)) - 12;
    const utcH = (hh - offset + 24) % 24;
    try { await api('update-schedule', { hour: utcH, minute: mm }); $('#schedMsg').className = 'msg ok'; $('#schedMsg').textContent = `Horaire enregistré : ${$('#schedTime').value} (Paris).`; state.cron = `${mm} ${utcH} * * *`; }
    catch (err) { $('#schedMsg').className = 'msg err'; $('#schedMsg').textContent = err.message; }
  };
  $('#refreshRuns').onclick = loadStatus;
  $('#apForm').onsubmit = async e => {
    e.preventDefault();
    const body = { enabled: $('#apOn').checked, threads_per_day: +$('#apN').value, min_odds: +$('#apOdds').value,
      weekly_recap: $('#apWeekly').checked };
    try {
      const js = await api('admin', { action: 'autopilot', autopilot: body });
      state.autopilot = js.autopilot;
      $('#apMsg').className = 'msg ok';
      $('#apMsg').textContent = js.autopilot.enabled
        ? `Autopilote activé : ${js.autopilot.threads_per_day} thread(s) par soir.` : 'Autopilote désactivé.';
    } catch (err) { $('#apMsg').className = 'msg err'; $('#apMsg').textContent = err.message; }
  };
}

async function loadStatus() {
  if (!state.pw) return;
  try { const js = await api('admin', { action: 'status' }); state.runs = js.runs; state.cron = js.cron; }
  catch (err) { state.runs = state.runs || []; toast(err.message); }
  renderHealth();
  if (!$('#control').hidden) renderControl();
}


// ---------------- X account (followers + reply bot) ----------------
const AUTH_LABELS = {
  ok: 'connecté', session_invalid: 'déconnecté de X', no_cookies: 'déconnecté (aucun cookie)',
  cookies_expired: 'déconnecté (cookies expirés)', browser_launch_failed: 'navigateur introuvable sur le PC',
  no_llm_key: 'clé LLM (Groq) manquante',
};

function followersSVG(stats, runs) {
  const pts = stats.filter(s => s.followers != null);
  if (pts.length < 2) return '<p class="hint">La courbe apparaît dès qu’il y a deux relevés.</p>';
  const W = 760, H = 230, L = 40, R = 10, T = 12, B = 48;
  const d0 = new Date(pts[0].date + 'T00:00:00Z'), d1 = new Date(pts[pts.length - 1].date + 'T00:00:00Z');
  const span = Math.max(1, (d1 - d0) / 864e5);
  const x = d => L + ((new Date(d + 'T00:00:00Z') - d0) / 864e5) / span * (W - L - R);
  const vals = pts.map(p => p.followers);
  const lo = Math.floor(Math.min(...vals) * 0.95), hi = Math.ceil(Math.max(...vals) * 1.03);
  const y = v => T + (1 - (v - lo) / Math.max(1, hi - lo)) * (H - T - B - 22);
  // replies per day (bars along the bottom)
  const perDay = {};
  for (const r of runs) for (const rp of (r.replies || [])) {
    if (rp.dry_run) continue;
    const d = (rp.posted_at || '').slice(0, 10);
    if (d) perDay[d] = (perDay[d] || 0) + 1;
  }
  const maxRep = Math.max(1, ...Object.values(perDay));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des followers et réponses par jour">`;
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round(lo + (hi - lo) * i / ticks), yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`;
  }
  const bw = Math.max(2, (W - L - R) / span * 0.6);
  for (const [d, n] of Object.entries(perDay)) {
    if (new Date(d + 'T00:00:00Z') < d0 || new Date(d + 'T00:00:00Z') > d1) continue;
    const h = n / maxRep * 26;
    s += `<rect x="${x(d) - bw / 2}" y="${H - B + 4 + (26 - h)}" width="${bw}" height="${h}" fill="var(--muted)" opacity=".35"><title>${d} : ${n} réponses</title></rect>`;
  }
  s += `<polyline fill="none" stroke="var(--ball)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => `${x(p.date).toFixed(1)},${y(p.followers).toFixed(1)}`).join(' ')}"/>`;
  const last = pts[pts.length - 1];
  s += `<circle cx="${x(last.date)}" cy="${y(last.followers)}" r="4" fill="var(--ball)"/>`;
  s += `<text x="${L}" y="${H - 6}">${pts[0].date.slice(5)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${last.date.slice(5)}</text>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">barres grises : réponses postées par jour</text>`;
  return s + '</svg>';
}

function delta(pts, days) {
  if (pts.length < 2) return null;
  const last = pts[pts.length - 1];
  const day = d => new Date(d + 'T00:00:00Z');
  const target = new Date(day(last.date) - days * 864e5).toISOString().slice(0, 10);
  const base = [...pts].reverse().find(p => p.date <= target);
  // no reading close to the start of the window (e.g. a gap of months): no fake "7-day" change
  if (!base || (day(target) - day(base.date)) / 864e5 > Math.max(2, days * 0.3)) return null;
  return last.followers - base.followers;
}

function renderAccount() {
  const el = $('#account');
  const stats = (state.vstats || []).filter(s => s.followers != null);
  const runs = state.vruns || [];
  const xs = state.xstatus || {};
  const sched = state.vschedule || { schedules: [], settings: { max_replies: 25 }, enabled: true };
  const last = stats[stats.length - 1];
  const d7 = delta(stats, 7), d30 = delta(stats, 30);
  const sign = v => v == null ? '–' : (v >= 0 ? '+' : '') + v;
  const lastRun = [...runs].reverse()[0];
  const lastOkRun = [...runs].reverse().find(r => r.auth === 'ok');
  const replies = runs.flatMap(r => (r.replies || []).map(rp => ({ ...rp }))).reverse().slice(0, 30);
  const week = runs.filter(r => r.at && (Date.now() - new Date(r.at)) < 7 * 864e5);
  const weekReplies = week.reduce((a, r) => a + (r.replied || 0), 0);

  const apiState = xs.ok === true ? `<span class="dot ok"></span>API X : <b>${esc(xs.handle || 'ok')}</b> · vérifiée ${ago(xs.checked_at)}`
    : xs.ok === false ? `<span class="dot bad"></span>API X : <b>erreur</b> · ${esc(xs.error || '')}`
    : `<span class="dot"></span>API X : pas encore vérifiée`;
  const botState = !lastRun ? `<span class="dot"></span>Bot de réponses : aucune session depuis la fusion`
    : lastRun.auth === 'ok' && (lastRun.crash || lastRun.stop_reason === 'browser_crashed')
      ? `<span class="dot warn"></span>Bot de réponses : <b>connecté</b> · dernière session interrompue (navigateur arrêté) ${ago(lastRun.at)}`
    : lastRun.auth === 'ok' ? `<span class="dot ok"></span>Bot de réponses : <b>connecté</b> · dernière session ${ago(lastRun.at)}`
    : `<span class="dot bad"></span>Bot de réponses : <b>${esc(AUTH_LABELS[lastRun.auth] || lastRun.auth)}</b> · ${ago(lastRun.at)}`;
  const needsLogin = lastRun && lastRun.auth && !['ok', 'no_llm_key'].includes(lastRun.auth);
  const needsKey = lastRun && lastRun.auth === 'no_llm_key';

  el.innerHTML = `
  <div class="panel">
    <div class="scoreline" style="justify-content:space-between">
      <div class="scoreline"><div class="big">${last ? last.followers : '–'}</div>
        <div><div class="hint" style="margin:0">followers${last ? ` au ${longDay(last.date)}` : ''}</div>
        <div style="font:500 15px var(--mono)">${d7 != null || d30 != null ? `${sign(d7)} sur 7 j · ${sign(d30)} sur 30 j`
          : stats.length > 1 ? `${sign(last.followers - stats[stats.length - 2].followers)} depuis le relevé du ${longDay(stats[stats.length - 2].date)}` : ''}</div></div></div>
    </div>
    <div style="margin-top:12px">${followersSVG(state.vstats || [], runs)}</div>
  </div>

  <div class="cols" style="margin-top:12px">
    <div class="panel"><h3>Connexion au compte</h3>
      <p class="hint">Deux accès distincts : l'API officielle (threads + relevé quotidien des followers) et la session navigateur du bot de réponses (sur le serveur IONOS).</p>
      <div class="runs"><div style="display:flex;gap:8px;align-items:center;padding:6px 0">${apiState}</div>
      <div style="display:flex;gap:8px;align-items:center;padding:6px 0">${botState}</div></div>
      ${needsKey ? `<p class="warn" style="margin:8px 0 0">Colle ta clé Groq dans « Clé du modèle (Groq) » ci-dessous.</p>` : ''}
      ${needsLogin ? `<p class="warn" style="margin:8px 0 0">Le bot n'est pas connecté à X : colle tes cookies ci-dessous.</p>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="xCheck">Tester la connexion X</button></div>
      <div class="msg" id="xMsg"></div>
      <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Connecter le bot de réponses à X</summary>
        <p class="hint" style="margin:8px 0">Sur un navigateur connecté au compte @NBAPredictLab, ouvre x.com, puis l'extension <b>Cookie-Editor</b> → <b>Export</b> → <b>JSON</b>, et colle le résultat ici. Ou colle juste <code>auth_token=…; ct0=…</code>. Les cookies sont chiffrés avant d'être stockés comme secret GitHub, et personne ne peut les relire.</p>
        <textarea id="cookiesIn" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--wash);font:12px var(--mono)" placeholder='[{"name":"auth_token",...}] ou auth_token=...; ct0=...'></textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="cookiesSave">Enregistrer les cookies</button>
          <button class="btn" type="button" id="loginCheck">Vérifier la connexion du bot</button></div>
        <div class="msg" id="cookiesMsg"></div>
      </details>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Proxy résidentiel (IPRoyal)</summary>
        <p class="hint" style="margin:8px 0">X affiche un captcha Cloudflare aux serveurs GitHub : le bot doit passer par une IP résidentielle. Chez IPRoyal → Residential → choisis la France, une session <b>sticky</b> (même IP) et le format <code>http://utilisateur:motdepasse@hote:port</code>, puis colle-le ici.</p>
        <div class="row"><input type="password" id="proxyIn" placeholder="http://user:pass@geo.iproyal.com:12321" autocomplete="off" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--wash)">
          <button class="btn" type="button" id="proxySave">Enregistrer</button></div>
        <div class="msg" id="proxyMsg"></div>
      </details>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Clé du modèle (Groq)</summary>
        <p class="hint" style="margin:8px 0">Clé gratuite sur console.groq.com → API Keys. Sans elle le bot ne répond pas (il ne poste jamais de réponses génériques).</p>
        <div class="row"><input type="password" id="groqIn" placeholder="gsk_…" autocomplete="off" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--wash)">
          <button class="btn" type="button" id="groqSave">Enregistrer</button></div>
        <div class="msg" id="groqMsg"></div>
      </details>
    </div>
    <div class="panel"><h3>Bot de réponses</h3>
      <p class="hint">${week.length} session${week.length > 1 ? 's' : ''} et ${weekReplies} réponses sur 7 jours${lastOkRun && lastOkRun.top_skips ? ` · principaux rejets : ${Object.keys(lastOkRun.top_skips).slice(0, 3).map(esc).join(', ')}` : ''}.</p>
      <form id="schedVision">
        <label class="row" style="gap:6px;margin-bottom:10px"><input type="checkbox" id="vEnabled" ${sched.enabled !== false ? 'checked' : ''}> Sessions automatiques activées</label>
        <div class="hint" style="margin:0 0 6px">Horaires (heure de Paris) :</div>
        <div class="row" id="vTimes">${(sched.schedules || []).map((t, i) => `
          <span class="pill"><input type="checkbox" data-i="${i}" ${t.enabled !== false ? 'checked' : ''} aria-label="Activer ${t.time}"> ${esc(t.time)}
          <button type="button" class="btn small" data-del="${i}" aria-label="Supprimer ${t.time}" style="padding:0 6px">×</button></span>`).join('')}
        </div>
        <div class="row" style="margin-top:8px"><input type="time" id="vNew"><button class="btn small" type="button" id="vAdd">Ajouter</button></div>
        <div class="row" style="margin-top:10px"><label>Réponses max par session <input type="number" id="vMax" min="1" max="100" value="${(sched.settings || {}).max_replies || 25}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--wash)"></label></div>
        <div class="row" style="margin-top:12px"><button class="btn" type="submit">Enregistrer</button>
          <button class="btn primary" type="button" id="vRun">Lancer une session</button>
          <button class="btn" type="button" id="vDry">Essai à blanc</button></div>
        <div class="msg" id="vMsg"></div>
      </form>
    </div>
  </div>

  <div class="panel" style="margin-top:12px"><h3>Dernières réponses</h3>
    <p class="hint">Le tweet d'origine et ce que le bot a répondu. Badge « fait » : la réponse cite une donnée vérifiée (bilan, série, prochain match).</p>
    ${replies.length ? `<ul class="results">${replies.map(rp => `
      <li style="grid-template-columns:1fr auto;align-items:start">
        <div><div class="hint" style="margin:0">@${esc(rp.author || '?')}${rp.tweet_likes ? ` · ${rp.tweet_likes} ♥` : ''} · ${ago(rp.posted_at)}${rp.dry_run ? ' · essai' : ''}${rp.context_used ? ' · <b style="color:var(--win)">fait</b>' : ''}</div>
          ${rp.tweet_text ? `<div style="color:var(--muted);font-size:13px">${esc(rp.tweet_text)}</div>` : ''}
          <div style="margin-top:3px">↳ ${esc(rp.reply_text)}</div></div>
        <a class="btn small" href="${esc(rp.tweet_url)}" target="_blank" rel="noopener">Voir</a></li>`).join('')}</ul>`
      : '<p class="hint" style="margin:0">Aucune réponse enregistrée depuis la fusion. Les sessions précédentes restent dans vision/run_logs.</p>'}
  </div>`;

  const needPw = fn => async (...a) => { if (!state.pw) { openLock(() => fn(...a)); return; } return fn(...a); };
  const msg = (id, cls, text) => { const m = $(id); m.className = 'msg ' + cls; m.textContent = text; };
  $('#xCheck').onclick = needPw(async () => {
    try { await api('admin', { action: 'x_check' }); msg('#xMsg', 'ok', 'Vérification lancée. Résultat ici dans 1 à 2 minutes.'); }
    catch (err) { msg('#xMsg', 'err', err.message); }
  });
  const saveSecret = (name, inputId, msgId, okText) => needPw(async () => {
    const value = $(inputId).value;
    if (!value.trim()) return;
    try { await api('admin', { action: 'set_secret', name, value }); $(inputId).value = ''; msg(msgId, 'ok', okText); }
    catch (err) { msg(msgId, 'err', err.message); }
  });
  $('#cookiesSave').onclick = saveSecret('TWITTER_COOKIES_JSON', '#cookiesIn', '#cookiesMsg',
    'Cookies enregistrés. Lance un « Essai à blanc » pour vérifier la connexion.');
  $('#groqSave').onclick = saveSecret('LLM_API_KEY', '#groqIn', '#groqMsg', 'Clé enregistrée.');
  $('#proxySave').onclick = saveSecret('BROWSER_PROXY', '#proxyIn', '#proxyMsg', 'Proxy enregistré. Clique « Vérifier la connexion du bot ».');
  $('#loginCheck').onclick = needPw(async () => {
    try { await api('admin', { action: 'vision_run', login_check: true }); msg('#cookiesMsg', 'ok', 'Vérification demandée : le serveur la lance dans les 5 minutes, résultat ici 3 minutes plus tard (recharge la page).'); }
    catch (err) { msg('#cookiesMsg', 'err', err.message); }
  });
  const draft = JSON.parse(JSON.stringify(sched));
  draft.schedules = draft.schedules || [];
  $('#vTimes').addEventListener('change', e => { const i = e.target.dataset.i; if (i != null) draft.schedules[i].enabled = e.target.checked; });
  $('#vTimes').addEventListener('click', e => {
    const i = e.target.dataset.del; if (i == null) return;
    draft.schedules.splice(+i, 1); state.vscheduleDirty = true; state.vschedule = { ...draft, enabled: $('#vEnabled').checked }; renderAccount();
  });
  $('#vAdd').onclick = () => {
    const t = $('#vNew').value; if (!t || draft.schedules.some(s => s.time === t)) return;
    draft.schedules.push({ time: t, enabled: true }); draft.schedules.sort((a, b) => a.time.localeCompare(b.time)); state.vscheduleDirty = true;
    state.vschedule = { ...draft, enabled: $('#vEnabled').checked }; renderAccount();
  };
  $('#schedVision').onsubmit = needPw(async e => {
    e && e.preventDefault && e.preventDefault();
    const body = { ...draft, enabled: $('#vEnabled').checked, settings: { max_replies: parseInt($('#vMax').value, 10) } };
    try { const r = await api('admin', { action: 'vision_schedule', schedule: body }); state.vschedule = r.schedule; state.vscheduleDirty = false; msg('#vMsg', 'ok', 'Horaires enregistrés. Visibles par le bot au prochain créneau.'); }
    catch (err) { msg('#vMsg', 'err', err.message); }
  });
  const run = dry => needPw(async () => {
    try {
      await api('admin', { action: 'vision_run', dry_run: dry, max_replies: parseInt($('#vMax').value, 10) });
      msg('#vMsg', 'ok', dry ? 'Essai demandé : le serveur le lance dans les 5 minutes (cherche et rédige sans poster).' : 'Session demandée : le serveur la lance dans les 5 minutes.');
    } catch (err) { msg('#vMsg', 'err', err.message); }
  });
  $('#vRun').onclick = run(false);
  $('#vDry').onclick = run(true);
}

// ---------------- lock ----------------
let afterUnlock = null;
function openLock(cb) { afterUnlock = cb || null; $('#lockMsg').textContent = ''; $('#pw').value = ''; $('#lockDlg').showModal(); $('#pw').focus(); }
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value;
  $('#lockMsg').className = 'msg'; $('#lockMsg').textContent = 'Vérification…';
  setPw(pw);
  try {
    await api('admin', { action: 'verify' });
    $('#lockDlg').close(); toast('Console déverrouillée.');
    loadStatus(); if (!$('#control').hidden) renderControl();
    const cb = afterUnlock; afterUnlock = null; cb && cb();
  } catch (err) { setPw(null); $('#lockMsg').className = 'msg err'; $('#lockMsg').textContent = err.message; }
});
$('#lockBtn').addEventListener('click', () => {
  if (state.pw) { setPw(null); state.runs = null; renderHealth(); renderControl(); toast('Console verrouillée.'); }
  else openLock();
});
document.addEventListener('click', e => { if (e.target.matches('[data-close]')) e.target.closest('dialog').close(); });

// ---------------- tabs + boot ----------------
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  for (const id of ['slate', 'record', 'account', 'control']) $('#' + id).hidden = id !== b.dataset.tab;
  try { localStorage.setItem('pl_tab', b.dataset.tab); } catch (e) {}
  if (b.dataset.tab === 'record') renderRecord();
  if (b.dataset.tab === 'control') renderControl();
  if (b.dataset.tab === 'account') renderAccount();
}));

async function load() {
  const [g, d, vs, vr, xs, vsc, pl, apr] = await Promise.allSettled([getJSON('pending_games.json'), getJSON('dashboard.json'),
    getJSON('vision/stats.json'), getJSON('vision/runs.json'), getJSON('x_status.json'), getJSON('vision/schedule.json'),
    getJSON('vision/publish_log.json'), getJSON('autopilot.json')]);
  const val = r => r.status === 'fulfilled' ? r.value : null;
  state.vstats = val(vs) || []; state.vruns = val(vr) || []; state.xstatus = val(xs) || {};
  if (!state.vscheduleDirty) state.vschedule = val(vsc);
  state.games = g.status === 'fulfilled' ? g.value : { games: [] };
  state.dash = d.status === 'fulfilled' ? d.value : null;
  // drop local "launched" marks once the JSON says published
  state.publog = Array.isArray(val(pl)) ? val(pl) : [];
  if (val(apr) && !document.activeElement?.closest?.('#apForm')) state.autopilot = val(apr);
  for (const x of [...(state.games.games || []), ...(state.games.specials || [])]) {
    if (x.published) { state.launched.delete(x.id); continue; }
    if (state.launched.has(x.id) && Date.now() - (state.launchedAt[x.id] || 0) > 20 * 60000) state.launched.delete(x.id);
    // a failure reported after this click ends the "launched" state
    const last = lastPublish(x.id);
    if (last && !last.ok && state.launched.has(x.id) && Date.parse(last.at) > (state.launchedAt[x.id] || 0)) {
      state.launched.delete(x.id);
      toast(`Publication échouée : ${last.error || 'voir le serveur'}`);
    }
  }
  saveLaunched();
  renderHealth(); renderSlate();
  if (!$('#record').hidden) renderRecord();
  if (!$('#control').hidden) renderControl();
  if (!$('#account').hidden && !document.activeElement?.closest?.('#account')) renderAccount();
  $('#foot').innerHTML = `Données du ${state.games.generated_at ? new Date(state.games.generated_at).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' }) : '–'} · <a href="${REPO_URL}" target="_blank" rel="noopener">dépôt</a>`;
}

setPw(state.pw);
let saved = null;
try { saved = localStorage.getItem('pl_tab'); } catch (e) {}
if (saved && saved !== 'slate') document.querySelector(`nav.tabs button[data-tab="${saved}"]`)?.click();
renderSlate();
load().then(loadStatus);
setInterval(load, 120000);
</script>
